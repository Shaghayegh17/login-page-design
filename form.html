<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
    <link rel="stylesheet" href="form.css" />
  </head>
  <body>
    <header>
      <nav>>Home Page</nav>
    </header>
    <main class="main">
      <section class="signup">
        <h2>Create Account</h2>
        <form action="../formprojhe/" method="post">
          <div>
          <label for="fullname">Full Name</lege>
            <input type="text" id="fullname" />
          </div>
          <div>
            <input type="password" id="password" placeholder="Password" />
          </div>
          <div>
            <input type="email" id="email" placeholder="Email" />
          </div>
          <div id="rul">
            <input type="checkbox" name="rule" id="rule" />
            <label for="rule">I accept the terms of agreements</label>
          </div>
          <div >
            <input type="submit" value="Sign Up" id="su" />
          </div>
        </form>
      </section>
      <section class="signin">
        <h1>Get started</h1>
        <div >
          <p id="lablein">Do you already have an account?</p>
          
          <input type="submit" value="Sign in" id="signin" />
        </div>
      </section>
    </main>
  </body>
</html>
