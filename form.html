<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
    <link rel="stylesheet" href="form.css" />
    <link rel="stylesheet" href="./cssnormalize.css" />
  </head>
  <body>
    <header>
      <nav>>Home Page</nav>
    </header>
    <main class="main">
      <section class="signup">
        <h2>Create Account</h2>
        <form action="../formprojhe/" method="post">
          <div>
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" required name="fullname" />
          </div>
          <div>
            <input
              type="password"
              id="password"
              placeholder="Password"
              name="password"
              required
            />
          </div>
          <div>
            <input
              type="email"
              id="email"
              placeholder="Email"
              name="email"
              required
            />
          </div>
          <div>
            <input type="radio" name="gender" id="male" value="male" />
            <label for="male">Male</label>
            <input type="radio" name="gender" value="female" />
            <label for="female">Female</label>
          </div>
          <div>
            <select name="howgetknow" id="select">
              <option value="getknow">نحوه آشنایی</option>
              <option value="friend">معرفی دوستان</option>

              <option value="socialmedia">اینستاگرام،تلگرام و ...</option>
              <option value="site">سایت</option>
            </select>
          </div>
          <div>
            <input
              type="text"
              name="friendname"
              id="friendname"
              placeholder="نام دوست خود را وارد کنید"
              required
            />
          </div>
          <div>
            <input type="file" name="file" id="file" accept="pdf" multiple />
          </div>
          <div id="rul">
            <input type="checkbox" name="rule" id="rule" />
            <label for="rule">I accept the terms of agreements</label>
          </div>
          <div>
            <input type="submit" value="Sign Up" id="su" />
          </div>
        </form>
      </section>
      <section class="signin">
        <h1>Get started</h1>
        <div class="lablel">
          <label for="lablein">Do you already have an account?</label>
          <input type="checkbox" name="siginbefore" id="lablein" />
        </div>

        <div>
          <input type="submit" value="Sign in" id="signin" name="signin" />
        </div>
      </section>
    </main>
    <script src="form.js"></script>
  </body>
</html>
